name: Moliys Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - moliys-build

permissions:
  contents: read

jobs:
  build:
    name: Build mobile arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMobileArm64_v8aDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moliys-tv-arm64-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
