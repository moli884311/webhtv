name: Moliys Merge Release

on:
  workflow_dispatch:
  push:
    branches:
      - moliys-merge

permissions:
  contents: read

jobs:
  build:
    name: Build 沫离接口 arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOLIYS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "missing MOLIYS_KEYSTORE_B64 secret" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/moliys-release.jks"

      - name: Write local.properties
        env:
          STORE_PASSWORD: ${{ secrets.MOLIYS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOLIYS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOLIYS_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/moliys-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties

      - name: Build release
        env:
          WEBHTV_RELEASE_TAG: moliys-1.0.38
          WEBHTV_APK_SUFFIX: moliys
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMobileArm64_v8aFullRelease :app:assembleMobileArm64_v8aJingjianRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moliys-tvbox-arm64-release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
